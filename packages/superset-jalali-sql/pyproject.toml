[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-jalali-sql"
version = "1.0.0"
description = "Jalali calendar and Jinja SQL macros for Apache Superset virtual datasets"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "superset-jalali" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jdatetime==6.1.0",
  "persiantools==4.0.0",
  "sqlglot>=25",
  "psycopg[binary]>=3.2",
  "flask>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "postgres: integration test against a real PostgreSQL database",
]
