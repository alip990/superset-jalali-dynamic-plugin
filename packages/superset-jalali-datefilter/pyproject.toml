[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superset-jalali-datefilter"
version = "1.0.0"
description = "Jalali dashboard date filter for Apache Superset 6.1"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superset_jalali_datefilter = ["static/*"]
